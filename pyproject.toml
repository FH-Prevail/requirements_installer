[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements_installer"
version = "1.2.0"
description = "Automatically detect and install Python dependencies from your code"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Sina Mirshahi", email = "sina7th@gmail.com"}
]
keywords = ["pip", "requirements", "dependencies", "automation", "installer", "jupyter", "notebook"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Installation/Setup",
    "Environment :: Console",
    "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/FH-Prevail/requirements_installer"
Repository = "https://github.com/FH-Prevail/requirements_installer"
Issues = "https://github.com/FH-Prevail/requirements_installer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["requirements_installer"]

[tool.setuptools.package-data]
"requirements_installer" = ["module_mappings.json"]

[project.scripts]
requirements_installer = "requirements_installer:main"